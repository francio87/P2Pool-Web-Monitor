services:
  p2pool-mini:
    image: ghcr.io/sethforprivacy/p2pool:latest
    restart: unless-stopped
    tty: true
    stdin_open: true
    volumes:
      - p2pool-data:/home/p2pool
      - /dev/hugepages:/dev/hugepages
    ports:
      - "35443:3333"
      - "37888:37888"
    command: >-
      --wallet REPLACE_WITH_YOUR_MONERO_WALLET
      --host p2pmd.xmrvsbeast.com --rpc-port 18081 --zmq-port 18084
      --host node2.monerodevs.org --rpc-port 18089 --zmq-port 18084
      --host xmr-full.p2pool.uk --rpc-port 18089 --zmq-port 18084
      --host xmr-pruned.p2pool.uk --rpc-port 18089 --zmq-port 18084
      --stratum 0.0.0.0:3333
      --light-mode
      --mini
      --local-api
      --data-api /home/p2pool
      --no-upnp
      --stratum-api
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "max_age=300; now=$$(date +%s); fresh() { test -s \"$$1\" || exit 1; mt=$$(stat -c %Y \"$$1\" 2>/dev/null || echo 0); age=$$((now - mt)); test \"$$age\" -le \"$$max_age\"; }; positive() { grep -Eq \"\\\"$$2\\\"[[:space:]]*:[[:space:]]*[1-9][0-9]*\" \"$$1\"; }; listen() { grep -Eq \":$$1[[:space:]].*[[:space:]]0A[[:space:]]\" /proc/net/tcp /proc/net/tcp6 2>/dev/null; }; fresh /home/p2pool/local/p2p && fresh /home/p2pool/pool/stats && fresh /home/p2pool/network/stats && positive /home/p2pool/local/p2p peer_list_size && positive /home/p2pool/local/p2p connections && positive /home/p2pool/pool/stats sidechainHeight && positive /home/p2pool/pool/stats sidechainDifficulty && positive /home/p2pool/network/stats height && positive /home/p2pool/network/stats difficulty && listen 0D05 && listen 9400",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

  p2pool-wm:
    image: ghcr.io/francio87/p2pool-web-monitor:latest
    restart: unless-stopped
    volumes:
      - p2pool-data:/p2pool-data:ro
      - wm-output:/output
    depends_on:
      p2pool-mini:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "if [ -f /app/src/container_healthcheck.py ]; then exec python3 /app/src/container_healthcheck.py --output-dir /output --max-age 120 --http-url http://127.0.0.1:8080/index.html; fi; test -s /output/data.json && test -s /output/history.json",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "3380:80"
    volumes:
      - wm-output:/usr/share/nginx/html:ro
    depends_on:
      p2pool-wm:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -s /usr/share/nginx/html/data.json && test -s /usr/share/nginx/html/index.html && age=$$(($(date +%s) - $(stat -c %Y /usr/share/nginx/html/data.json))) && test \"$$age\" -le 120 && grep -q '\"meta\"' /usr/share/nginx/html/data.json && wget -q -O - http://127.0.0.1/ | grep -q 'P2Pool' && wget -q -O - http://127.0.0.1/data.json | grep -q '\"meta\"'",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  p2pool-data:
  wm-output:
